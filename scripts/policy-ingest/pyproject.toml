[project]
name = "policy-ingest"
version = "0.1.0"
description = "Local PII redaction and fact extraction for Fin360 policy documents"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pdfplumber>=0.11",
  "presidio-analyzer>=2.2",
  "spacy>=3.7,<4",
  "httpx>=0.27",
  "pydantic>=2.7",
  "anthropic>=0.60",
  "en-core-web-lg",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[project.scripts]
policy-ingest = "policy_ingest.cli:main"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
